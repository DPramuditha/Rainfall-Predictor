name: Rainfall Predictor Test Suite CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rainfall_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Comprehensive Test Suite
        env:
          SECRET_KEY: 'ci-secret-key-testing-rainfall-predictor'
          DEBUG: 'False'
          USE_POSTGRES: 'true'
          DB_NAME: 'rainfall_db'
          DB_USER: 'postgres'
          DB_PASSWORD: 'postgres'
          DB_HOST: 'localhost'
          DB_PORT: '5432'
        run: |
          python run_tests.py
